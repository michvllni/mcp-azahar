# SPDX-License-Identifier: GPL-3.0-or-later
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# Release config for goreleaser v2. Runs in .github/workflows/release.yml after
# a GitHub release is published; uploads assets into that existing release.
# The version comes from its tag, which is checked against `const version` in
# cmd/mcp-azahar/main.go.
version: 2

project_name: mcp-azahar

before:
  hooks:
    - go mod tidy -diff
    # Real releases only; snapshot builds (CI dry run) have no matching tag.
    - '{{ if .IsSnapshot }}true{{ else }}./scripts/check-version.sh {{ .Tag }}{{ end }}'

builds:
  - id: mcp-azahar
    main: ./cmd/mcp-azahar
    binary: mcp-azahar
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/michvllni/mcp-azahar/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/michvllni/mcp-azahar/internal/version.Date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

# Container image (DECISIONS.md D10). Needs docker buildx, the env vars
# AZAHAR_VERSION/AZAHAR_SHA256 (from .devcontainer/Dockerfile) and
# .release/azahar-source/ from scripts/azahar-source.sh; the release workflow
# provides all three. Snapshot builds tag <version>-amd64 and do not push.
dockers_v2:
  - id: image
    ids: [mcp-azahar]
    dockerfile: packaging/image/Dockerfile
    images:
      - ghcr.io/michvllni/mcp-azahar
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64 # Azahar ships x86_64 AppImages only
    build_args:
      AZAHAR_VERSION: "{{ .Env.AZAHAR_VERSION }}"
      AZAHAR_SHA256: "{{ .Env.AZAHAR_SHA256 }}"
    extra_files:
      - LICENSE
      - .devcontainer/install-azahar.sh
      - packaging/image/NOTICE.md
      - .release/azahar-source/azahar-LICENSE.txt
    labels:
      org.opencontainers.image.title: mcp-azahar
      org.opencontainers.image.description: Unofficial MCP server and CLI for the Azahar 3DS emulator, with Azahar, Xvfb and Mesa
      org.opencontainers.image.source: https://github.com/michvllni/mcp-azahar
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: GPL-3.0-or-later # mcp-azahar; Azahar: see NOTICE.md in the image
      # Ownership check of the official MCP Registry for OCI packages.
      io.modelcontextprotocol.server.name: io.github.michvllni/mcp-azahar
      io.github.azahar.version: "{{ .Env.AZAHAR_VERSION }}"

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  # Azahar's source tarball (GPL, D10) is attached by release.yml before
  # goreleaser runs, so a pushed image never lacks it.
  # The GitHub release already exists: keep its notes, keep its title
  # (RELEASE_NAME from the workflow; tag when unset, e.g. local dry runs).
  mode: keep-existing
  name_template: '{{ if index .Env "RELEASE_NAME" }}{{ index .Env "RELEASE_NAME" }}{{ else }}{{ .Tag }}{{ end }}'
  # goreleaser always sets the pre-release flag; tags with a SemVer suffix
  # (v1.0.0-rc.1) are pre-releases. The workflow checks the UI checkbox matches.
  prerelease: auto
  footer: |
    Unofficial tool, not affiliated with the Azahar project. Requires Azahar 2127.0 or newer.
