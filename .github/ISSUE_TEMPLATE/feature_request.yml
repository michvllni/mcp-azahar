# SPDX-License-Identifier: GPL-3.0-or-later
name: Feature request
description: Suggest a new command, MCP tool or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to test or automate, and what is missing?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Commands, flags or MCP tools you'd like. CLI and MCP always get the same feature.
    validations:
      required: true
  - type: dropdown
    id: azahar
    attributes:
      label: Does this need a change in Azahar itself?
      description: For example a new RPC command. Such changes are proposed upstream separately.
      options:
        - "No"
        - "Yes"
        - Not sure
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
