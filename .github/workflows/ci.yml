# SPDX-License-Identifier: GPL-3.0-or-later
# Checks for every pull request and every push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff
      - run: go vet ./...
      - name: go vet with the integration tag (compiles live tests)
        run: go vet -tags integration ./...
      - run: go build ./...
      - run: go test -race -count=1 ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Keep in sync with .devcontainer/install-go-tools.sh (Renovate does).
          # renovate: datasource=github-releases depName=golangci/golangci-lint
          version: v2.15.0

  checks:
    name: Repo checks and release dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Install pinned tools (same versions as the dev container)
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          .devcontainer/install-go-tools.sh -d "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: actionlint
        run: actionlint
      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck
      - name: SPDX headers
        run: scripts/check-spdx.sh
      - name: goreleaser check
        run: goreleaser check
      - name: goreleaser snapshot build (all platforms)
        run: goreleaser build --snapshot --clean

  fixture:
    name: Build test fixture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # devkitPro refuses downloads from some networks; its image works in CI.
    container: devkitpro/devkitarm:20260610@sha256:116afba8df8453961de2936ffab20dd441edf4d682856c1ec8b0e53d7ed0bbf5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: testdata/fixture/build.sh -o build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixture
          path: build/
          retention-days: 14

  integration:
    name: Integration tests (Azahar)
    needs: fixture
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Debian trixie like the dev container: Azahar 2127 needs glibc >= 2.39.
    container: debian:trixie@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6
    steps:
      - name: Install Xvfb, Mesa and Azahar's host libraries (as in .devcontainer/Dockerfile)
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates curl binutils squashfs-tools \
            xvfb xauth libgl1-mesa-dri libegl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libfontconfig1 libdbus-1-3 libopengl0 libharfbuzz0b libjack-jackd2-0 \
            libasound2t64 libfribidi0 libusb-1.0-0 \
            libcom-err2 libgmp10 libice6 libsm6 libwayland-client0 libfreetype6 \
            libgbm1 libgl1 libglx0 libx11-6 libx11-xcb1 libxcb1 libxcb-dri3-0 libdrm2 zlib1g
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Install Azahar (the version and digest pinned in the Dockerfile)
        run: |
          ver="$(sed -n 's/^ARG AZAHAR_VERSION=//p' .devcontainer/Dockerfile)"
          sha="$(sed -n 's/^ARG AZAHAR_SHA256=//p' .devcontainer/Dockerfile)"
          .devcontainer/install-azahar.sh -t "$ver" -s "$sha" -d /opt/azahar
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fixture
          path: build
      - name: Integration tests against Azahar with the fixture
        env:
          AZAHAR_BIN: /opt/azahar/AppRun
          MCPAZ_LIVE: "1"
        run: >-
          MCPAZ_FIXTURE_DIR="$GITHUB_WORKSPACE/build"
          go test -tags integration -p 1 -count=1 -v -run 'TestFixture|TestLiveLaunch' ./cmd/mcp-azahar/ ./internal/emu/

  image:
    name: Container image (build and launch the fixture)
    needs: fixture
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Install pinned tools (same versions as the dev container)
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          .devcontainer/install-go-tools.sh -d "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Azahar version, digest and license (pinned in .devcontainer/Dockerfile)
        run: |
          echo "AZAHAR_VERSION=$(sed -n 's/^ARG AZAHAR_VERSION=//p' .devcontainer/Dockerfile)" >> "$GITHUB_ENV"
          echo "AZAHAR_SHA256=$(sed -n 's/^ARG AZAHAR_SHA256=//p' .devcontainer/Dockerfile)" >> "$GITHUB_ENV"
          scripts/azahar-source.sh -l
      - name: goreleaser snapshot (binaries and the image, not pushed)
        run: goreleaser release --snapshot --clean
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fixture
          path: fixture
      - name: The image launches the fixture headless and takes a screenshot
        run: |
          images="$(docker images --format '{{.Repository}}:{{.Tag}}')"
          image="$(grep '^ghcr.io/michvllni/mcp-azahar:' <<<"$images" | head -n1)"
          test -n "$image"
          echo "image: $image"
          docker run --rm "$image" version
          chmod a+rwx fixture
          docker run --rm -v "$PWD/fixture:/work" --entrypoint sh "$image" -euc '
            mcp-azahar launch fixture.3dsx --elf fixture.elf
            mcp-azahar wait-for test_state.mode MODE_RUN --timeout 60s
            mcp-azahar press A
            mcp-azahar wait-for test_state.last_buttons 1 --timeout 10s
            mcp-azahar screenshot --screen both -o shot.png
            mcp-azahar logs --contains "fixture: ready"
            mcp-azahar stop'
          test -s fixture/shot.png
          # stdin stays open a few seconds, so the server answers before EOF.
          { printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'; sleep 5; } \
            | docker run -i --rm "$image" | tee mcp.out
          grep -q azahar_screenshot mcp.out
