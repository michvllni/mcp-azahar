# SPDX-License-Identifier: GPL-3.0-or-later
# Builds and uploads release assets with goreleaser when a GitHub release
# is published (the release creates the tag). Fails before building anything
# unless the tag equals "v" + the `version` constant in cmd/mcp-azahar/main.go
# and the pre-release checkbox matches the version's SemVer suffix.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag and pre-release flag match version in main.go
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: scripts/check-version.sh -p "$PRERELEASE" "$GITHUB_REF_NAME"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  release:
    name: goreleaser
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write # ghcr.io/michvllni/mcp-azahar
      id-token: write # npm trusted publishing (OIDC, provenance)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Azahar version, digest and source tarball (pinned in .devcontainer/Dockerfile)
        run: |
          echo "AZAHAR_VERSION=$(sed -n 's/^ARG AZAHAR_VERSION=//p' .devcontainer/Dockerfile)" >> "$GITHUB_ENV"
          echo "AZAHAR_SHA256=$(sed -n 's/^ARG AZAHAR_SHA256=//p' .devcontainer/Dockerfile)" >> "$GITHUB_ENV"
          scripts/azahar-source.sh
      - name: Attach Azahar's source tarball first (GPL; before any image is pushed)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" .release/azahar-source/azahar-unified-source-*.tar.xz --clobber
      - name: buildx builder (needed for the SBOM attestation) and ghcr login
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker buildx create --name goreleaser --use
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          # Keep in sync with .devcontainer/install-go-tools.sh (Renovate does).
          # renovate: datasource=github-releases depName=goreleaser/goreleaser
          version: v2.20.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Keeps the title entered in the GitHub release (see .goreleaser.yaml).
          RELEASE_NAME: ${{ github.event.release.name }}
      # npm (D10): the platform packages and the wrapper, from goreleaser's
      # binaries in dist/. Trusted publishing: no token; each package has a
      # trusted publisher for this file (AGENTS.md). Re-runs skip published
      # versions.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Publish npm packages
        run: |
          npm --version
          scripts/npm-packages.sh -v "${GITHUB_REF_NAME#v}" -p

  registry:
    name: MCP Registry
    # Last (D10): the registry checks that the npm package and the image
    # exist and name this server. Pre-releases stay off the registry. On the
    # first release the new ghcr package is private: make it public, then
    # re-run this job ("Re-run failed jobs").
    needs: release
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # mcp-publisher login github-oidc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Install mcp-publisher (pinned, signature verified)
        run: |
          scripts/install-mcp-publisher.sh -d "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Wait until npm serves this version
        # npm processes new versions for a few minutes after the publish;
        # the registry checks the npm package (v0.1.0 failed here at first).
        run: |
          v="${GITHUB_REF_NAME#v}"
          for _ in $(seq 60); do
            if [ "$(npm view "mcp-azahar@$v" version 2>/dev/null)" = "$v" ]; then exit 0; fi
            sleep 15
          done
          echo "mcp-azahar@$v did not appear on npm within 15 minutes" >&2
          exit 1
      - name: Publish server.json for this version
        run: |
          scripts/server-json.sh -v "${GITHUB_REF_NAME#v}" -o "$RUNNER_TEMP/registry/server.json"
          cd "$RUNNER_TEMP/registry"
          mcp-publisher login github-oidc
          mcp-publisher publish
